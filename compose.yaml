name: dom-v-srok

x-container-env: &container-env
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  MAX_CA_BUNDLE: ""

services:
  caddy:
    build: { context: ., dockerfile: docker/Dockerfile, target: caddy }
    environment:
      SERVER_NAME: "${SERVER_NAME:-:80}"
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: { context: ., dockerfile: docker/Dockerfile, target: php }
    env_file: .env
    environment: *container-env
    volumes: [storage:/app/storage]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/Dockerfile, target: php }
    command: php artisan queue:work redis --queue=updates,default --tries=5 --backoff=5,30,120,600 --max-time=3600 --sleep=0.2
    user: www-data
    stop_grace_period: 30s
    env_file: .env
    environment: *container-env
    volumes: [storage:/app/storage]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  scheduler:
    build: { context: ., dockerfile: docker/Dockerfile, target: php }
    command: php artisan schedule:work
    user: www-data
    env_file: .env
    environment: *container-env
    volumes: [storage:/app/storage]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  poller:
    profiles: [polling]
    build: { context: ., dockerfile: docker/Dockerfile, target: php }
    command: php artisan bot:poll
    user: www-data
    env_file: .env
    environment: *container-env
    volumes: [storage:/app/storage]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-dom}"
      POSTGRES_USER: "${DB_USERNAME:-dom}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD не задан в .env}"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dom} -d ${DB_DATABASE:-dom}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}
  caddy_data: {}
  caddy_config: {}
