openapi: 3.1.0
info:
  title: Дом в срок — API мини-приложения
  version: 0.1.0
  description: |
    REST API кабинета диспетчера и карточки жителя. Контракт пишется первым: из него генерируются типы
    фронта (openapi-typescript) и им проверяются ответы в тестах (Spectator).
    Все ответы — объекты `{ data }` или `{ data, meta }`. Ошибки — `{ error: { code, message, details } }`.
servers:
  - url: /api/v1
    description: тот же домен, что и мини-приложение
tags:
  - name: auth
  - name: me
  - name: catalog
  - name: requests
  - name: organization
  - name: journal
  - name: attachments
  - name: demo
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Токен Sanctum из POST /auth/max или POST /auth/login
  responses:
    Unauthenticated:
      description: Нет или просрочен токен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Не та роль или не та организация
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Validation:
      description: Ошибка валидации; поля в details.fields
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Недопустимый переход статуса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: Превышен лимит запросов; код too_many_requests, заголовки Retry-After, X-RateLimit-Limit, X-RateLimit-Remaining
      headers:
        Retry-After: { schema: { type: integer } }
        X-RateLimit-Limit: { schema: { type: integer } }
        X-RateLimit-Remaining: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Ошибка сервера; код server_error, в details.request_id идентификатор запроса для логов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_transition] }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }
    RequestStatus:
      type: string
      enum: [new, assigned, in_progress, done, confirmed, returned, redirected]
    Role:
      type: string
      enum: [resident, dispatcher, admin]
    Organization:
      type: object
      required: [id, name, type, phone_ads, direct_contracts, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [uk, tsj, jsk] }
        phone_ads: { type: string }
        phone_dispatch: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        reception_hours: { type: [string, 'null'] }
        reception_address: { type: [string, 'null'] }
        direct_contracts:
          type: object
          required: [cold_water, hot_water, heat, power, tko]
          properties:
            cold_water: { type: boolean }
            hot_water: { type: boolean }
            heat: { type: boolean }
            power: { type: boolean }
            tko: { type: boolean }
        is_demo: { type: boolean }
    House:
      type: object
      required: [id, address, entrances, qr_token, chat_bound, chat_pinned, chat_keywords_enabled, start_url, qr_url]
      properties:
        id: { type: integer }
        address: { type: string }
        entrances: { type: integer }
        qr_token: { type: string }
        chat_bound: { type: boolean, description: 'домовой чат привязан командой /дом <код>' }
        chat_pinned: { type: boolean, description: 'карточка дома закреплена в чате; для этого бот должен быть администратором чата' }
        chat_keywords_enabled: { type: boolean, description: 'бот предлагает присоединиться к открытой заявке, когда в чате пишут о той же проблеме' }
        start_url: { type: string, description: 'deep link дома для QR-плаката и кнопки в чате' }
        qr_url: { type: string, description: 'подписанная ссылка на PNG с QR-кодом deep link дома, без срока действия; для плаката в подъезде добавьте &entrance=N' }
    User:
      type: object
      required: [id, name, role, is_demo]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organization:
          oneOf:
            - $ref: '#/components/schemas/Organization'
            - type: 'null'
        house:
          oneOf:
            - $ref: '#/components/schemas/House'
            - type: 'null'
        entrance: { type: [integer, 'null'] }
        flat: { type: [string, 'null'] }
        is_demo: { type: boolean }
    AuthToken:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    Deadline:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer }
        unit: { type: string, enum: [hours, days, working_days] }
    Category:
      type: object
      required: [id, slug, name, is_emergency, verify]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        is_emergency: { type: boolean }
        responsible_type: { type: [string, 'null'] }
        deadline_fix:
          oneOf:
            - $ref: '#/components/schemas/Deadline'
            - type: 'null'
        deadline_reply:
          oneOf:
            - $ref: '#/components/schemas/Deadline'
            - type: 'null'
        basis: { type: [string, 'null'] }
        advice: { type: [string, 'null'] }
        verify: { type: boolean, description: 'строка справочника помечена «сверить с первоисточником»' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    Executor:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        specialty: { type: [string, 'null'] }
        phone: { type: [string, 'null'], description: 'только сотрудникам организации, жителю null' }
    OrganizationUpdate:
      type: object
      description: 'Частичное обновление: передаются только меняемые поля'
      properties:
        name: { type: string, maxLength: 200 }
        phone_ads: { type: string, maxLength: 32, description: 'аварийная служба, обязательна' }
        phone_dispatch: { type: [string, 'null'], maxLength: 32 }
        email: { type: [string, 'null'], maxLength: 254 }
        reception_hours: { type: [string, 'null'], maxLength: 500 }
        reception_address: { type: [string, 'null'], maxLength: 500 }
        direct_contracts:
          type: object
          description: 'прямые договоры с РСО: при включённом флаге по коммунальной услуге отвечает поставщик'
          properties:
            cold_water: { type: boolean }
            hot_water: { type: boolean }
            heat: { type: boolean }
            power: { type: boolean }
            tko: { type: boolean }
    HouseUpdate:
      type: object
      properties:
        entrances: { type: integer, minimum: 1, maximum: 50 }
        chat_keywords_enabled: { type: boolean }
    ExecutorInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 32 }
        specialty: { type: [string, 'null'], maxLength: 64 }
    ExecutorUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 32 }
        specialty: { type: [string, 'null'], maxLength: 64 }
    Contractor:
      type: object
      required: [id, type, type_label, name]
      properties:
        id: { type: integer }
        type: { type: string, enum: [lift, intercom, tko, other] }
        type_label: { type: string }
        name: { type: string }
        phone: { type: [string, 'null'] }
    ContractorInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [lift, intercom, tko, other], description: 'подрядчик этого типа перекрывает региональную сторону при расчёте ответственного' }
        name: { type: string, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 32 }
    OrganizationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Organization' }
    HouseResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/House' }
    HouseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/House' }
    ExecutorResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Executor' }
    ExecutorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Executor' }
    ContractorResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Contractor' }
    ContractorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Contractor' }
    OkResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
    RequestListItem:
      type: object
      required: [id, status, status_label, category, description, address, responsible_name, is_sure, is_overdue, participants_count, created_at]
      properties:
        id: { type: integer, description: 'номер заявки' }
        status: { $ref: '#/components/schemas/RequestStatus' }
        status_label: { type: string }
        category: { type: string }
        description: { type: [string, 'null'], description: 'null для соседа, который присоединился к заявке' }
        address: { type: string }
        entrance: { type: [integer, 'null'], description: 'null для соседа, который присоединился к заявке' }
        flat: { type: [string, 'null'], description: 'null для соседа, который присоединился к заявке' }
        responsible_name: { type: string }
        is_sure: { type: boolean }
        deadline_fix_at: { type: [string, 'null'], format: date-time }
        deadline_reply_at: { type: [string, 'null'], format: date-time }
        is_overdue: { type: boolean }
        executor:
          oneOf:
            - $ref: '#/components/schemas/Executor'
            - type: 'null'
        participants_count: { type: integer }
        created_at: { type: string, format: date-time }
    RequestEvent:
      type: object
      required: [id, type, actor_role, created_at]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [created, assigned, status_changed, redirected, returned, confirmed, comment, photo_added, participant_joined, notification, reminder]
        from_status: { type: [string, 'null'] }
        to_status: { type: [string, 'null'] }
        actor_role: { type: string, enum: [resident, dispatcher, system] }
        actor_name: { type: [string, 'null'] }
        comment: { type: [string, 'null'] }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    Attachment:
      type: object
      required: [id, kind, mime, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [resident, closing] }
        mime: { type: string }
        url: { type: [string, 'null'], description: 'подписанная ссылка на 15 минут' }
        created_at: { type: string, format: date-time }
    RequestCard:
      type: object
      required: [id, status, status_label, allowed_transitions, category, description, house, responsible, basis, is_overdue, closed_late, returned_count, participants_count, origin, created_at]
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/RequestStatus' }
        status_label: { type: string }
        allowed_transitions:
          type: array
          items: { $ref: '#/components/schemas/RequestStatus' }
        category:
          type: object
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        description: { type: [string, 'null'], description: 'null для соседа, который присоединился к заявке' }
        house: { $ref: '#/components/schemas/House' }
        entrance: { type: [integer, 'null'], description: 'null для соседа, который присоединился к заявке' }
        flat: { type: [string, 'null'], description: 'null для соседа, который присоединился к заявке' }
        responsible:
          type: object
          required: [kind, name, is_sure]
          properties:
            kind: { type: string, enum: [organization, party, unknown] }
            name: { type: string }
            phone: { type: [string, 'null'] }
            is_sure: { type: boolean }
            party_id: { type: [integer, 'null'] }
        deadline_fix_at: { type: [string, 'null'], format: date-time }
        deadline_reply_at: { type: [string, 'null'], format: date-time }
        basis: { type: string }
        is_overdue: { type: boolean }
        closed_late: { type: boolean }
        executor:
          oneOf:
            - $ref: '#/components/schemas/Executor'
            - type: 'null'
        first_reaction_at: { type: [string, 'null'], format: date-time }
        done_at: { type: [string, 'null'], format: date-time }
        confirmed_at: { type: [string, 'null'], format: date-time }
        confirmed_by: { type: [string, 'null'], enum: [resident, auto, dispatcher, null] }
        closed_at: { type: [string, 'null'], format: date-time }
        returned_count: { type: integer }
        redirected_to:
          type: object
          description: 'только у переадресованной заявки; name и phone — снимок того, что сообщили жителю'
          required: [name, phone, party, note]
          properties:
            name: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            party:
              oneOf:
                - type: object
                  required: [id, name]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    phone: { type: [string, 'null'] }
                - type: 'null'
            note: { type: [string, 'null'] }
        participants_count: { type: integer }
        origin: { type: string, enum: [qr, chat, direct, api] }
        rating: { type: [integer, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/RequestEvent' }
        attachments:
          type: array
          description: 'соседу, который присоединился к заявке, фото жителя не отдаются, только фото закрытия'
          items: { $ref: '#/components/schemas/Attachment' }
        created_at: { type: string, format: date-time }
    Counters:
      type: object
      required: [new, in_progress, overdue, closed]
      properties:
        new: { type: integer }
        in_progress: { type: integer }
        overdue: { type: integer }
        closed: { type: integer }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        counters: { $ref: '#/components/schemas/Counters' }
    RequestCardResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/RequestCard' }
    RequestListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/RequestListItem' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
        links: { type: object, additionalProperties: true }
    JournalRow:
      type: object
      required: [id, created_at, address, resident_name, category, description, responsible_name, basis, status, status_label, is_overdue, closed_late, returned_count, participants_count]
      properties:
        id: { type: integer, description: 'номер заявки' }
        created_at: { type: string, format: date-time }
        address: { type: string }
        entrance: { type: [integer, 'null'] }
        flat: { type: [string, 'null'] }
        resident_name: { type: string, description: 'после /delete_me — «Житель (удалён)»' }
        category: { type: string }
        description: { type: string }
        responsible_name: { type: string }
        responsible_phone: { type: [string, 'null'] }
        deadline_fix_at: { type: [string, 'null'], format: date-time }
        basis: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        status_label: { type: string }
        executor_name: { type: [string, 'null'] }
        first_reaction_at: { type: [string, 'null'], format: date-time }
        done_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        is_overdue: { type: boolean }
        closed_late: { type: boolean, description: 'выполнена после срока' }
        confirmed_by: { type: [string, 'null'], enum: [resident, auto, dispatcher, null] }
        returned_count: { type: integer }
        redirected_to: { type: [string, 'null'] }
        participants_count: { type: integer }
    JournalSummary:
      type: object
      required: [total, open, overdue, closed, on_time, late, returned, redirected, first_reaction_minutes]
      properties:
        total: { type: integer, description: 'заявок принято за период' }
        open: { type: integer }
        overdue: { type: integer, description: 'открытые, у которых срок уже вышел' }
        closed: { type: integer, description: 'подтверждено или переадресовано' }
        on_time: { type: integer, description: 'выполнено до срока' }
        late: { type: integer, description: 'выполнено после срока' }
        returned: { type: integer, description: 'заявок, которые житель хотя бы раз вернул' }
        redirected: { type: integer }
        first_reaction_minutes: { type: [integer, 'null'], description: 'среднее время до первого действия диспетчера; null, если действий не было' }
    JournalMeta:
      type: object
      required: [current_page, last_page, per_page, total, period, summary]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        summary: { $ref: '#/components/schemas/JournalSummary' }
    JournalResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/JournalRow' }
        meta: { $ref: '#/components/schemas/JournalMeta' }
        links: { type: object, additionalProperties: true }
    JournalCsvLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, description: 'подписанная ссылка на CSV журнала за период; открывается без токена, например в браузере телефона' }
        expires_at: { type: string, format: date-time, description: 'после этого времени ссылка отвечает 403' }
paths:
  /auth/max:
    post:
      tags: [auth]
      operationId: authMax
      security: []
      summary: Вход из мини-приложения по initData MAX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data: { type: string, description: 'window.WebApp.initData как есть' }
      responses:
        '200':
          description: Токен и профиль
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      security: []
      summary: Вход тестовой учётки (только DEMO_ACCOUNTS_ENABLED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Токен и профиль
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AuthToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Отозвать текущий токен
      responses:
        '200':
          description: Готово
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /me:
    get:
      tags: [me]
      operationId: me
      summary: Профиль, организация, дом
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /catalog/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      security: []
      summary: Дерево категорий со сроками и основаниями
      responses:
        '200':
          description: Корни с детьми
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/ServerError' }
  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      summary: Очередь организации диспетчера
      parameters:
        - in: query
          name: status
          description: 'группы: open — все незакрытые (new, assigned, in_progress, returned); active — в работе (assigned, in_progress, returned, done); closed — confirmed и redirected'
