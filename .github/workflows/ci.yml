name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env: { POSTGRES_DB: dom_test, POSTGRES_USER: dom, POSTGRES_PASSWORD: dom }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dom" --health-interval 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: dom_test
      DB_USERNAME: dom
      DB_PASSWORD: dom
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, gd, zip, redis
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pest --ci
      - run: composer audit || true

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run api:types && git diff --exit-code resources/js/miniapp/api/schema.d.ts
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start timer
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: php
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-app:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-app:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max
      - name: Build time
        run: echo "build took $(( $(date +%s) - ${{ steps.timer.outputs.start }} )) s (limit 300)"
      - name: Build caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: caddy
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-caddy:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-caddy:latest
          cache-from: |
            type=gha,scope=php
            type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php, js, docker, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/dom-v-srok' }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host deploy\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  BatchMode yes\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" "$SSH_PORT" > ~/.ssh/config
          ssh-keygen -l -f ~/.ssh/deploy
      - name: Copy compose files and deploy script
        run: scp compose.yaml compose.prod.yaml docker/deploy.sh "deploy:$DEPLOY_PATH/"
      - name: Login to ghcr on the server
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh deploy "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Deploy
        run: ssh deploy "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,} sh '$DEPLOY_PATH/deploy.sh' '${{ github.sha }}'"
      - name: Logout
        if: always()
        run: ssh deploy "docker logout ghcr.io" || true
